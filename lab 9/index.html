<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Pokemones</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="./images/poke.png" alt="PokeAPI Logo" class="logo">
        </div>
        <h1>Buscador de pokemones</h1>
        <p>Busca desde pokemones hasta las habilidades de los mismos.</p>

        <div class="search-box">
            <input type="text" id="search" placeholder="Nombre del Pokémon">
            <div class="button-container">
                <button id="clear-btn" style="display: none;">Limpiar</button>
                <button id="search-btn">Buscar</button>
            </div>
        </div>

        <div id="pokemon-info" class="pokemon-info" style="display: none;">
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
