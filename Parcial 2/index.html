<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema para Generar Números</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="container">
    <h1>Sistema para Generar Números</h1>
    <div class="controls">
      <button id="generateButton" onclick="app.generateNumber()">Generar</button>
      <button id="ascendButton" onclick="app.sortNumbers('asc')">↑</button>
      <button id="descendButton" onclick="app.sortNumbers('desc')">↓</button>
    </div>
    <div id="number-container" class="number-display"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
