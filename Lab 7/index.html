<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplicación de Votación</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div id="app">
    <h1>Aplicación de Votación</h1>
    <div id="candidate-form">
      <input type="text" id="candidate-name" placeholder="Nombre del candidato" required>
      <input type="color" id="candidate-color" value="#ff0000">
      <button onclick="app.addCandidate()">Agregar Candidato</button>
    </div>
    <div id="candidate-list"></div>
    <canvas id="chart" width="400" height="200"></canvas>
  </div>
  <script src="app.js"></script>
</body>
</html>
